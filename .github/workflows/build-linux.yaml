name: build-linux

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Linux package targets
        type: choice
        options:
          - deb,appimage,rpm
          - deb
          - appimage
          - rpm
        default: deb,appimage,rpm
      app_env:
        description: APP_ENV used by setup.dart
        type: choice
        options:
          - pre
          - stable
        default: pre

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TARGETS: ${{ github.event.inputs.targets || 'deb,appimage,rpm' }}
      APP_ENV: ${{ github.event.inputs.app_env || 'pre' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-linux-amd64
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libsecret-1-dev \
            rpm patchelf libfuse2 locate

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Add pub global packages to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build packages
        run: >-
          dart setup.dart linux
          --targets "$TARGETS"
          --env "$APP_ENV"
          -v

      - name: Write checksums
        run: |
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          cd dist && sha256sum ./* > SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: honganclash-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
