name: cleanup old releases

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy v0.9.4 release and old tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          delete() {
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$1" >/dev/null 2>&1 || true
          }
          delete "$api/releases/tags/v0.9.4"
          delete "$api/git/refs/tags/v0.9.4"
          delete "$api/git/refs/tags/v0.9.3"
